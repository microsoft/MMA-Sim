[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mmasim-kernels"
version = "2.0.2"
authors = [{ name="Peichen Xie", email="peichenxie@microsoft.com" }]
requires-python = ">=3.10"
dependencies = ["mmasim>=2.0.2"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
mmasim_kernels = [
    "amd/kernels/*.hip",
    "amd/kernels/*.h",
    "nv_ptx/kernels/*.cu",
    "nv_ptx/kernels/*.h",
]
